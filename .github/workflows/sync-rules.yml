name: Sync BlackMatrix7 Rules

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 04:20 执行；GitHub Actions 使用 UTC。
    - cron: "20 20 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Convert rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          cfg = yaml.safe_load(Path("rules.yml").read_text(encoding="utf-8"))

          for item in cfg.get("rules", []):
              cmd = [
                  "python", "scripts/convert.py",
                  "--name", item["name"],
                  "--source", item["source"],
                  "--output", item["output"],
                  "--routing", str(item.get("routing", 0)),
                  "--description", item.get("description", ""),
              ]
              subprocess.run(cmd, check=True)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules/

          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi

          git commit -m "sync rules"
          git push
